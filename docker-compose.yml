services:
  sleeper-optimizer:
    build: .
    container_name: sleeper-optimizer
    restart: unless-stopped
    ports:
      - "8009:8009"
    environment:
      HOST: 0.0.0.0
      PORT: 8009
      DATA_DIR: /data
    volumes:
      - sleeper-optimizer-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8009/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  sleeper-optimizer-data:
